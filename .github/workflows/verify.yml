name: verify

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -r requirements.txt
      - name: 导入冒烟：运行时依赖 PySide6 / Pillow 可导入且版本可读
        run: python -c "import PIL, PySide6; from PIL import Image, ImageDraw; print('Pillow', PIL.__version__); print('PySide6', PySide6.__version__)"
      - name: 断言 Pillow 版本满足 requirements.txt 下限（防装上旧版假绿）
        shell: bash
        run: |
          python <<'PY'
          import PIL
          req = next(line.split('>=')[1].strip() for line in open('requirements.txt', encoding='utf-8') if line.startswith('Pillow'))
          installed = tuple(int(p) for p in PIL.__version__.split('+')[0].split('.')[:3])
          expected = tuple(int(p) for p in req.split('.')[:3])
          assert installed >= expected, (PIL.__version__, req)
          print('Pillow', PIL.__version__, 'satisfies Pillow>=' + req)
          PY
      - run: bash verify.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.13" }
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pyright

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npx --yes @commitlint/cli@19 --extends @commitlint/config-conventional@19 --from "${{ github.event.pull_request.base.sha }}" --to HEAD
